  <header><div class="wrap"><div class="eyebrow">JAPANESE · IDIOMS &amp; PROVERBS</div><h1>国語・受験対策クイズ</h1><p class="subtitle">四字熟語・ことわざを、意味と表現の両方から身につけよう。</p></div></header>
  <main class="wrap"><section class="panel" id="home"></section><section class="panel" id="quiz" hidden><div class="quiz-head"><span id="counter"></span><span class="tag" id="modeLabel"></span></div><div class="bar"><span id="bar"></span></div><div class="kind" id="kind"></div><div class="question" id="question"></div><div id="choices"></div><div class="feedback" id="feedback"></div><button class="next" id="next"></button></section><section class="panel" id="result" hidden><h2>今日の結果</h2><div class="score" id="score"></div><p class="result" id="resultText"></p><div class="actions"><button class="action primary" id="retry">もう一度</button><button class="action" id="back">モードを選び直す</button></div></section></main>

ことわざ|口は災いの元|軽はずみな発言が、思わぬ災難を招くこと

ことわざ|縁の下の力持ち|人に知られない所で、他人を支えること。また、その人

ことわざ|棚からぼたもち|思いがけない幸運が、向こうからやって来ること

ことわざ|虎穴に入らずんば虎子を得ず|大きな成果を得るには、危険を恐れず挑戦する必要があること
ことわざ|立つ鳥跡を濁さず|その場を去るときは、後始末をきちんとして美しく去るべきだということ

ことわざ|取り越し苦労|まだ起きていない先のことを、あれこれ心配すること`.trim().split('\n').map(line=>{const [type,phrase,meaning]=line.split('|');return{type,phrase,meaning}});
    const make=(filter)=>shuffle(data.filter(x=>filter==='all'||x.type===filter)).flatMap(x=>{const peers=data.filter(y=>y.type===x.type&&y.phrase!==x.phrase);const pick=arr=>shuffle(arr).slice(0,3);return[{...x,direction:'meaning',text:`次の意味に当てはまる${x.type}はどれですか。\n${x.meaning}`,answer:x.phrase,options:shuffle([x.phrase,...pick(peers.map(y=>y.phrase))])},{...x,direction:'phrase',text:`「${x.phrase}」の意味として最も適切なものはどれですか。`,answer:x.meaning,options:shuffle([x.meaning,...pick(peers.map(y=>y.meaning))])}]});
    let active=[],index=0,score=0,mode='all';
    function home(){const log=JSON.parse(localStorage.getItem('japanese-idiom-log')||'{}')[day()];$('home').hidden=false;$('quiz').hidden=true;$('result').hidden=true;$('home').innerHTML=`<div class="daily"><span>📘 ${log?`今日は <b>${log.correct} / ${log.total}</b> 問正解`:'今日の記録はまだありません'}</span><span>四字熟語50・ことわざ50／計200問</span></div><p class="intro">意味から表現を選ぶ問題と、表現から意味を選ぶ問題を半分ずつ出題します。すべて中学入試でよく問われる語句です。</p><div class="setting">出題する範囲を選ぶ</div><div class="modes"><button class="mode" data-mode="all"><strong>朝の国語ランダム 10問</strong><span>四字熟語・ことわざをバランスよく。</span></button><button class="mode" data-mode="四字熟語"><strong>四字熟語 10問</strong><span>意味と表現を往復して覚える。</span></button><button class="mode" data-mode="ことわざ"><strong>ことわざ 10問</strong><span>教訓・たとえ・使い方を確認。</span></button></div>`;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));}
    function start(m){mode=m;active=shuffle(make(m)).slice(0,10);index=0;score=0;$('home').hidden=true;$('quiz').hidden=false;$('result').hidden=true;render()}
    function render(){const q=active[index];$('counter').textContent=`第 ${index+1} 問 / 10`;$('modeLabel').textContent=mode==='all'?'四字熟語・ことわざ':mode;$('bar').style.width=`${index*10}%`;$('kind').textContent=`${q.type}・${q.direction==='meaning'?'意味 → 表現':'表現 → 意味'}`;$('question').textContent=q.text;$('feedback').className='feedback';$('next').className='next';$('choices').innerHTML='';q.options.forEach(a=>{const b=document.createElement('button');b.className='choice';b.textContent=a;b.onclick=()=>judge(a,b);$('choices').append(b)})}
    function judge(value,button){if($('next').classList.contains('show'))return;const q=active[index],ok=value===q.answer;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct')});if(!ok)button.classList.add('wrong');if(ok)score++;$('feedback').innerHTML=ok?`<b>正解！</b>「${q.phrase}」：${q.meaning}`:`<b>おしい！ 正解は「${q.answer}」</b>「${q.phrase}」：${q.meaning}`;$('feedback').classList.add('show');$('next').textContent=index===9?'今日の結果を見る':'次の問題へ';$('next').classList.add('show')}
    function finish(){const logs=JSON.parse(localStorage.getItem('japanese-idiom-log')||'{}'),d=day(),old=logs[d]||{correct:0,total:0};old.correct+=score;old.total+=10;logs[d]=old;localStorage.setItem('japanese-idiom-log',JSON.stringify(logs));$('quiz').hidden=true;$('result').hidden=false;$('score').textContent=`${score} / 10`;$('resultText').textContent=score>=9?'とても良い仕上がりです。意味まで自分の言葉で説明できるか挑戦しよう。':score>=7?'よくできました。間違えた語句は解説を声に出して読み直そう。':'解説を確認して、表現と意味をセットで覚えよう。'}
    $('next').onclick=()=>{index++;index<10?render():finish()};$('retry').onclick=()=>start(mode);$('back').onclick=home;home();
  })();
  </script>
</body>
