<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>理科・受験対策クイズ</title><style>
:root{--navy:#16485a;--gold:#d68a26;--paper:#fffef9;--ink:#18343f;--line:#dfe7df;--ok:#18775c;--ng:#b9464c}*{box-sizing:border-box}body{margin:0;background:#eef3ee;color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto}header{background:linear-gradient(120deg,#124a5c,#2c7c75);color:#fff;padding:29px 0}h1{font-size:clamp(1.5rem,5vw,2.1rem);margin:5px 0}.eyebrow{font-size:.75rem;letter-spacing:.12em;font-weight:700;opacity:.85}.sub{margin:0;opacity:.9}main{padding:25px 0 45px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:24px;box-shadow:0 7px 22px #26433412}.daily{padding:13px 15px;border-radius:11px;background:#e7f3ee;color:#286354;display:flex;justify-content:space-between;gap:9px}.intro{line-height:1.75;color:#52666a}.title{font-weight:800;margin:20px 0 9px}.levels,.modes,.actions{display:flex;flex-wrap:wrap;gap:9px}.level,.mode,.action{font:inherit;cursor:pointer;border:0;border-radius:10px}.level{padding:9px 13px;border:1px solid #c9dcd8;background:#fff;color:#286354}.level.selected{color:#fff;background:var(--navy)}.mode{flex:1;min-width:210px;text-align:left;padding:18px;border:2px solid var(--line);background:#fff;color:var(--ink)}.mode:hover{border-color:var(--gold)}.mode strong{display:block;font-size:1.04rem;margin-bottom:5px}.mode span{font-size:.87rem;color:#667085}.hidden{display:none}.top{display:flex;justify-content:space-between;gap:8px;color:#667085;font-weight:700;font-size:.9rem}.badge{background:#f9e7bd;color:#76520d;border-radius:99px;padding:4px 9px}.bar{height:7px;background:#e3e9e5;border-radius:20px;overflow:hidden;margin:15px 0 25px}.bar div{height:100%;background:var(--gold);transition:.25s}.kind{font-size:.78rem;color:#8d631b;font-weight:800}.q{font-size:clamp(1.1rem,3.3vw,1.4rem);font-weight:700;line-height:1.7;margin:8px 0 19px}.choices{display:grid;gap:9px}.choice{font:inherit;text-align:left;border:1px solid #cfdedc;background:#fff;border-radius:10px;padding:13px;color:var(--ink);cursor:pointer}.choice:disabled{cursor:default}.choice.correct{background:#e1f3eb;border-color:var(--ok)}.choice.wrong{background:#fbe8e8;border-color:var(--ng)}.answer{display:flex;gap:8px}.answer input{min-width:0;flex:1;font:inherit;font-size:1.05rem;border:2px solid #c9dcd8;border-radius:10px;padding:12px}.answer button,.next{font:inherit;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.diagram{background:#f2f8f6;border:1px solid #d4e4df;border-radius:10px;padding:13px;margin:0 0 15px;line-height:1.65}.feedback{display:none;margin-top:17px;padding:14px;border-radius:10px;background:#f7f4ec;line-height:1.7}.feedback.show{display:block}.next{display:none;margin:17px 0 0 auto}.next.show{display:block}#result{text-align:center;display:none}.score{font-size:4rem;line-height:1;color:var(--gold);font-weight:800;margin:18px}.review{text-align:left;border-top:1px solid var(--line);margin-top:20px;padding-top:16px}.review li{line-height:1.65;margin:8px 0}.action{padding:11px 16px;background:var(--navy);color:#fff;font-weight:700}.action.sub{background:#e7efed;color:var(--ink)}@media(max-width:530px){.card{padding:18px}.answer{flex-wrap:wrap}.answer button{width:100%}}
</style></head><body><header><div class="wrap"><div class="eyebrow">MORNING SCIENCE · ENTRANCE EXAM</div><h1>理科・受験対策クイズ</h1><p class="sub">実験・計算・資料読み取りを、朝の10問で。</p></div></header><main class="wrap"><section id="home" class="card"></section><section id="quiz" class="card hidden"><div class="top"><span id="counter"></span><span class="badge" id="label"></span></div><div class="bar"><div id="bar"></div></div><div class="kind" id="kind"></div><div class="q" id="question"></div><div id="diagram"></div><div id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">次へ</button></section><section id="result" class="card"><div class="eyebrow" style="color:#76520d">RESULT</div><h2>今日の理科、おつかれさま！</h2><div class="score" id="score"></div><p id="message"></p><div class="actions"><button class="action" id="retry">もう10問</button><button class="action sub" id="back">トップへ</button></div><div id="review"></div></section></main><script>
const $=x=>document.getElementById(x),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>[...a].sort(()=>Math.random()-.5),clean=x=>String(x||'').normalize('NFKC').replace(/[\s　,，。]/g,'').replace(/[はがをにへとでのも]/g,''),day=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());let level=2,active=[],idx=0,score=0,miss=[];function answerMatches(value,answer){let v=clean(value),a=clean(answer);if(!v)return false;if(/^[-+]?\d+(\.\d+)?$/.test(v)&&/^[-+]?\d+(\.\d+)?$/.test(a))return Math.abs(Number(v)-Number(a))<1e-9;return v===a||(v.length>=3&&a.startsWith(v))||(v.length>=2&&a.endsWith(v))}
const facts=`物理|電流|豆電球2個を直列につなぐと、1個のときと比べて明るさはどうなるか|暗くなる|電圧を分け合うため、1個あたりの明るさは小さくなります。|明るくなる/変わらない/つかなくなる
物理|電流|豆電球2個を並列につなぐと、1個のときと比べて明るさはどうなるか|ほぼ変わらない|それぞれに電池と同じ電圧がかかります。|暗くなる/半分になる/必ずつかなくなる
物理|光|光が空気から水へ斜めに入るとき、進む向きはどう変わるか|法線に近づく|密度の大きい物質へ入ると、光は法線に近づく向きに折れ曲がります。|法線から遠ざかる/まっすぐ進む/反射する
物理|音|音の高さを決める主な要素は何か|振動数|1秒間の振動回数が多いほど、高い音になります。|振幅/音源までの距離/空気の温度だけ
物理|てこ|支点から力点までの距離を長くすると、同じ重さを持ち上げる力はどうなるか|小さくてよい|支点から遠いほど、小さい力でつり合います。|大きく必要/変わらない/0になる
物理|ばね|ばねに加える力を2倍にすると、ばねののびはどうなるか|2倍になる|弾性の範囲では、加えた力とのびは比例します。|半分になる/変わらない/4倍になる
化学|水溶液|リトマス紙を赤色に変える水溶液の性質|酸性|酸性は青色リトマス紙を赤色に変えます。|中性/アルカリ性/飽和
化学|水溶液|BTB溶液が青色になる水溶液の性質|アルカリ性|BTB溶液は酸性で黄色、中性で緑色、アルカリ性で青色です。|酸性/中性/無色
化学|気体|石灰水を白くにごらせる気体|二酸化炭素|二酸化炭素を検出する代表的な方法です。|酸素/水素/窒素
化学|気体|火のついた線香を激しく燃えさせる気体|酸素|酸素にはものを燃やすはたらきがあります。|二酸化炭素/水素/窒素
化学|気体|水上置換法で集めにくい気体|アンモニア|アンモニアは水に非常に溶けやすい気体です。|酸素/水素/窒素
化学|金属|鉄がさびるために必要なもの|水と酸素|水だけ、酸素だけではなく両方が必要です。|水だけ/酸素だけ/二酸化炭素だけ
化学|燃焼|ものが燃えた後にできることが多い気体|二酸化炭素|有機物の燃焼では、炭素が酸素と結びつき二酸化炭素になります。|水素/酸素/窒素
生物|植物|植物が日光を受けて養分を作るはたらき|光合成|葉緑体で二酸化炭素と水から養分を作り、酸素を出します。|蒸散/呼吸/受粉
生物|植物|植物が根から吸収した水を、葉から水蒸気として出すはたらき|蒸散|主に気孔から水蒸気が出ます。|光合成/呼吸/発芽
生物|植物|花粉がめしべの柱頭につくこと|受粉|受粉後、胚珠が種子になります。|受精/発芽/蒸散
生物|人体|血液を全身へ送り出す器官|心臓|心臓の収縮と拡張で血液を循環させます。|肺/胃/腎臓
生物|人体|吸い込んだ空気から酸素を血液へ取り込む器官|肺|肺胞で酸素と二酸化炭素の交換を行います。|心臓/胃/肝臓
生物|人体|消化された養分を主に吸収する器官|小腸|小腸の内側には絨毛があり、表面積を大きくしています。|胃/大腸/食道
生物|生態系|食物連鎖で、植物のように養分を作る生物|生産者|動物は消費者、菌類などは分解者です。|消費者/分解者/捕食者
地学|天気|雲ができる直接の原因|空気が冷やされ水蒸気が水滴になる|露点まで冷えると水蒸気が凝結します。|空気が温められる/風が止まる/気圧が上がるだけ
地学|天気|日本付近で、低気圧の中心付近の風の向き|反時計回りに吹き込む|北半球では低気圧へ反時計回りに風が吹き込みます。|時計回りに吹き出す/まったく吹かない/東だけに吹く
地学|地層|地層のできた順序の原則|下の地層ほど古い|地層が逆転していない限り、下ほど先に積もりました。|上ほど古い/厚いほど新しい/化石がないほど古い
地学|火山|火山灰や火山れきが積もってできる岩石|凝灰岩|火山噴出物が固まってできます。|花こう岩/石灰岩/れき岩
地学|地震|地震の最初の小さなゆれ|初期微動|P波によるゆれで、後の主要動はS波によります。|主要動/余震/前震
地学|天体|月が満月から次の満月になるまでのおよその日数|約29.5日|月の満ち欠けの周期です。|約7日/約15日/約365日
地学|天体|北の空でほとんど動かないように見える星|北極星|地球の自転軸の延長上近くにあります。|シリウス/太陽/月`.trim().split('\n').map(x=>{let[a,b,text,answer,explain,wrong]=x.split('|');return{area:a,kind:b,text,answer,explain,wrong:wrong.split('/')}});
function calc(){let a=rnd(2,9),b=rnd(2,8),c=rnd(10,40);return[{area:'物理',kind:'電気・計算',text:`${a}Vの電池を${b}個直列につなぐと、全体の電圧は何Vですか。`,answer:a*b,explain:`直列では電圧を足します。${a}×${b}=${a*b}V。`,input:1},{area:'化学',kind:'濃さ・計算',text:`食塩${a}gを水${c}gに溶かしました。食塩水全体の重さは何gですか。`,answer:a+c,explain:`食塩水の重さ＝食塩＋水です。${a}+${c}=${a+c}g。`,input:1},{area:'生物',kind:'資料読み取り',text:`ある植物の葉を半分だけ黒い紙でおおい、日光に当てました。ヨウ素液で青紫色になるのはどちらですか。`,answer:'黒い紙でおおわなかった部分',explain:'日光が当たった部分でデンプンが作られるためです。',wrong:['黒い紙でおおった部分','葉全体','どちらも変化しない']},{area:'地学',kind:'地震・計算',text:`P波が秒速${a}km、S波が秒速${b}kmで伝わります。震源まで${a*b}kmの地点で、P波とS波の到着時刻の差は何秒ですか。`,answer:(a*b/b)-(a*b/a),explain:'それぞれ「距離÷速さ」で時間を求め、差をとります。',input:1}]}function make(){let all=facts.flatMap(x=>[{...x,type:'choice',level:1,options:shuffle([x.answer,...x.wrong])},{...x,type:'fill',level:3,input:1}]);let c=calc().flatMap(x=>[{...x,type:x.input?'fill':'choice',level:2,options:x.input?null:shuffle([x.answer,...x.wrong])}]);let pool=[...all,...c].filter(x=>x.level<=level);return shuffle(pool).slice(0,10)}function logs(){return JSON.parse(localStorage.getItem('morning-science-log')||'{}')}function save(){let a=logs(),d=day(),v=a[d]||{sets:0,correct:0,total:0};v.sets++;v.correct+=score;v.total+=10;a[d]=v;localStorage.setItem('morning-science-log',JSON.stringify(a))}
function home(){let l=logs()[day()];$('home').innerHTML=`<div class="daily"><span>🔬 ${l?`今日は <b>${l.correct}/${l.total}</b> 問正解（${l.sets}セット）`:'今日の記録はまだありません'}</span><span>朝10問</span></div><p class="intro">物理・化学・生物・地学を、実験の理由まで考えながら解きます。標準以上では記述入力も混ざります。</p><div class="title">難易度</div><div class="levels"><button class="level ${level===1?'selected':''}" data-l="1">基本</button><button class="level ${level===2?'selected':''}" data-l="2">標準・受験</button><button class="level ${level===3?'selected':''}" data-l="3">難関・記述多め</button></div><div class="modes" style="margin-top:22px"><button class="mode" id="start"><strong>朝の理科ランダム 10問</strong><span>4分野・実験・計算をバランスよく。</span></button></div>`;$('home').classList.remove('hidden');$('quiz').classList.add('hidden');$('result').style.display='none';document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{level=+b.dataset.l;home()});$('start').onclick=()=>{active=make();idx=0;score=0;miss=[];$('home').classList.add('hidden');$('quiz').classList.remove('hidden');render()}}
function render(){let q=active[idx];$('counter').textContent=`第 ${idx+1} 問 / 10`;$('label').textContent=['基本','標準・受験','難関'][level-1];$('bar').style.width=idx*10+'%';$('kind').textContent=`${q.area} · ${q.kind}`;$('question').textContent=q.text;$('diagram').innerHTML=q.input&&q.kind.includes('計算')?'<div class="diagram">単位を確かめてから、式を立てよう。</div>':'';$('feedback').className='feedback';$('next').className='next';$('answers').innerHTML='';if(q.type==='choice'){let b=document.createElement('div');b.className='choices';shuffle(q.options).forEach(x=>{let z=document.createElement('button');z.className='choice';z.textContent=x;z.onclick=()=>judge(x,z);b.append(z)});$('answers').append(b)}else{$('answers').innerHTML='<div class="answer"><input id="input" autocomplete="off" inputmode="decimal" placeholder="答えを入力"><button id="submit">答える</button></div>';$('submit').onclick=()=>judge($('input').value);setTimeout(()=>$('input').focus(),30)}}function judge(v,b){if($('next').classList.contains('show'))return;let q=active[idx],ok=answerMatches(v,q.answer);if(q.type==='choice'){document.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(clean(x.textContent)===clean(q.answer))x.classList.add('correct')});if(!ok)b.classList.add('wrong')}else{$('input').disabled=true;$('submit').disabled=true;$('input').style.borderColor=ok?'#18775c':'#b9464c'}if(ok)score++;else miss.push(q);$('feedback').innerHTML=ok?`<b>正解！</b>${q.explain}`:`<b>正解は「${q.answer}」</b>${q.explain}`;$('feedback').classList.add('show');$('next').textContent=idx===9?'結果を見る':'次へ';$('next').classList.add('show')}$('next').onclick=()=>{idx++;idx<10?render():result()};function result(){save();$('quiz').classList.add('hidden');$('result').style.display='block';$('score').textContent=`${score}/10`;$('message').textContent=score>=8?'朝から観察力が冴えています。明日も10問続けよう。':score>=5?'間違いの理由を一言で説明できれば十分。明日また挑戦しよう。':'実験の「なぜ」を解説で確認して、明日また挑戦しよう。';$('review').className=miss.length?'review':'';$('review').innerHTML=miss.length?`<h3>今日の復習（最大4問）</h3><ul>${miss.slice(0,4).map(q=>`<li><b>${q.answer}</b> — ${q.explain}</li>`).join('')}</ul>`:''}$('retry').onclick=()=>{active=make();idx=0;score=0;miss=[];$('result').style.display='none';$('quiz').classList.remove('hidden');render()};$('back').onclick=home;home();
</script></body></html>
