地学|天体|月の形が毎日少しずつ変わって見える理由|月と地球と太陽の位置関係が変わるから|月が地球の周りを公転し、明るく見える部分が変わります。|月自身が毎日形を変えるから/雲が月を削るから/地球が止まるから
生物|人体|だ液を加えたでんぷん液を温める実験で、ヨウ素液が青紫色にならない理由|でんぷんが別の養分に変わったから|だ液のはたらきで、でんぷんが糖に変わります。|水がなくなったから/ヨウ素液が消えたから/酸素が増えたから
生物|動物|メダカを観察するとき、尾びれの近くを見る理由|血液の流れが見えやすいから|薄くて透明な尾びれでは、血液の流れを観察しやすいです。|心臓があるから/えらがないから/骨がないから
生物|生態系|池の水を日光に当てたびんと暗い所に置いたびんで比べる実験の目的|植物の光合成と酸素の関係を調べる|日光があると水中植物が光合成し、酸素の量が変化します。|水の重さだけを調べる/魚の大きさを比べる/砂を作る`.trim().split('\n').map(x=>{let[area,kind,text,answer,explain,wrong]=x.split('|');return{area:'実験',kind:`${area}・${kind}`,text:`${text}。次のうち最も適切なものを選びなさい。`,answer,explain,wrong:wrong.split('/')}});
function calc(){let a=rnd(2,9),b=rnd(2,8),c=rnd(10,40);return[{area:'物理',kind:'電気・計算',text:`${a}Vの電池を${b}個直列につなぐと、全体の電圧は何Vですか。`,answer:a*b,explain:`直列では電圧を足します。${a}×${b}=${a*b}V。`,input:1},{area:'化学',kind:'濃さ・計算',text:`食塩${a}gを水${c}gに溶かしました。食塩水全体の重さは何gですか。`,answer:a+c,explain:`食塩水の重さ＝食塩＋水です。${a}+${c}=${a+c}g。`,input:1},{area:'生物',kind:'資料読み取り',text:`ある植物の葉を半分だけ黒い紙でおおい、日光に当てました。ヨウ素液で青紫色になるのはどちらですか。`,answer:'黒い紙でおおわなかった部分',explain:'日光が当たった部分でデンプンが作られるためです。',wrong:['黒い紙でおおった部分','葉全体','どちらも変化しない']},{area:'地学',kind:'地震・計算',text:`P波が秒速${a}km、S波が秒速${b}kmで伝わります。震源まで${a*b}kmの地点で、P波とS波の到着時刻の差は何秒ですか。`,answer:(a*b/b)-(a*b/a),explain:'それぞれ「距離÷速さ」で時間を求め、差をとります。',input:1}]}
function bulk(){let g=[],add=(area,kind,text,answer,explain)=>g.push({area,kind,text,answer:String(answer),explain,type:'fill',input:1,level:2});for(let n=1;n<=65;n++){let v=2+n%8,t=3+n%7;add('物理','速さ・計算',`秒速${v}mで${t}秒間進むと、進む距離は何mですか。`,v*t,`距離＝速さ×時間。${v}×${t}=${v*t}mです。`)}for(let n=1;n<=55;n++){let vol=3+n%6,d=2+n%7,m=vol*d;add('物理','密度・計算',`${m}gの物体の体積は${vol}cm³です。この物体の密度は何g/cm³ですか。`,d,`密度＝重さ÷体積。${m}÷${vol}=${d}です。`)}for(let n=1;n<=55;n++){let v=1+n%6,c=2+n%5;add('物理','電気・計算',`${v}Vの電池を${c}個直列につなぐと、全体の電圧は何Vですか。`,v*c,`直列つなぎでは電圧を足します。${v}×${c}=${v*c}Vです。`)}for(let n=1;n<=45;n++){let w=20+(n%8)*10,a=2+n%5,b=2+(n+2)%5;let ans=w*a/b;if(Number.isInteger(ans))add('物理','てこ・計算',`支点から${a}cmの所に${w}gのおもりを置きます。反対側の支点から${b}cmの所でつり合うおもりは何gですか。`,ans,`てこは「重さ×距離」が等しくなります。${w}×${a}÷${b}=${ans}gです。`)}for(let n=1;n<=70;n++){let salt=2+n%9,water=40+(n%8)*10,p=salt/(salt+water)*100;if(Number.isInteger(p))add('化学','濃さ・計算',`食塩${salt}gを水${water}gに溶かしました。食塩水の濃さは何％ですか。`,p,`濃さ＝食塩÷食塩水全体×100。${salt}÷${salt+water}×100=${p}％です。`)}for(let n=1;n<=55;n++){let s=5+n%8,w=30+(n%7)*10,e=10+(n%4)*5;add('化学','水溶液・計算',`食塩${s}gと水${w}gの食塩水から、水だけを${e}g蒸発させました。残る食塩の重さは何gですか。`,s,'水だけが蒸発するので、食塩の重さは変わりません。')}for(let n=1;n<=55;n++){let a=10+(n%8)*5,b=5+(n%5)*5;add('化学','質量保存・計算',`${a}gの物質Aと${b}gの物質Bを、気体が逃げない容器で反応させました。反応後の全体の重さは何gですか。`,a+b,`気体が逃げないなら全体の重さは変わりません。${a}+${b}=${a+b}gです。`)}for(let n=1;n<=55;n++){let days=2+n%7,each=3+n%6;add('生物','成長・計算',`ある植物が1日に${each}cmずつ、${days}日間伸びました。伸びた長さは何cmですか。`,days*each,`1日の伸び×日数。${each}×${days}=${days*each}cmです。`)}for(let n=1;n<=55;n++){let leaves=3+n%8,each=2+n%5;add('生物','蒸散・計算',`1枚の葉から1時間に${each}mLの水蒸気が出ます。同じ葉が${leaves}枚あると、1時間に何mL出ますか。`,leaves*each,`${leaves}×${each}=${leaves*each}mLです。`)}for(let n=1;n<=70;n++){let p=4+n%7,s=2+n%5,d=p*s;add('地学','地震・計算',`P波が秒速${p}kmで伝わり、震源までの距離が${d}kmのとき、P波が届くまで何秒かかりますか。`,s,`時間＝距離÷速さ。${d}÷${p}=${s}秒です。`)}for(let n=1;n<=55;n++){let h=2+n%7;add('地学','天気・計算',`気温が100m高くなるごとに0.6℃下がるとします。地上より${h*100}m高い地点では、気温は何℃下がりますか。`,h*0.6,`100mごとに0.6℃なので、${h}×0.6=${h*0.6}℃下がります。`)}return g}
function variants(rows,prefix){return rows.flatMap((x,i)=>{let source=prefix+i;return[{...x,source,type:'choice',level:1,options:shuffle([x.answer,...x.wrong])},{...x,source,type:'fill',level:3,input:1},{...x,source,type:'choice',level:2,text:`「${x.answer}」について正しい説明はどれですか。`,answer:x.explain,options:shuffle([x.explain,...shuffle(rows.filter(y=>y.answer!==x.answer).map(y=>y.explain)).slice(0,3)])}]})}function experimentChoices(){return experiments.map((x,i)=>({...x,source:'exp-'+i,type:'choice',level:1,options:shuffle([x.answer,...x.wrong])}))}function uniqueTen(pool){let used=new Set;return shuffle(pool).filter(q=>{let key=q.source||q.text;if(used.has(key))return false;used.add(key);return true}).slice(0,10)}function make(selected='総合'){let all=variants(facts,'fact-'),exp=experimentChoices(),c=calc().flatMap((x,i)=>[{...x,source:'calc-'+i,type:x.input?'fill':'choice',level:2,options:x.input?null:shuffle([x.answer,...x.wrong])}]);let pool=selected==='実験'?exp:[...all,...c,...bulk()].filter(x=>selected==='総合'||x.area===selected);return uniqueTen(pool.filter(x=>x.level<=level))}function logs(){return JSON.parse(localStorage.getItem('morning-science-log')||'{}')}function save(){let a=logs(),d=day(),v=a[d]||{sets:0,correct:0,total:0};v.sets++;v.correct+=score;v.total+=10;a[d]=v;localStorage.setItem('morning-science-log',JSON.stringify(a))}
function startQuiz(selected){topic=selected;active=make(topic);idx=0;score=0;miss=[];$('home').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function home(){let l=logs()[day()];$('home').innerHTML=`<div class="daily"><span>🔬 ${l?`今日は <b>${l.correct}/${l.total}</b> 問正解（${l.sets}セット）`:'今日の記録はまだありません'}</span><span>700問以上</span></div><p class="intro">分野を選んで集中的に練習できます。1セット内では、同じ元問題・同じ文章の出題を重ねません。</p><div class="title">難易度</div><div class="levels"><button class="level ${level===1?'selected':''}" data-l="1">基本</button><button class="level ${level===2?'selected':''}" data-l="2">標準・受験</button><button class="level ${level===3?'selected':''}" data-l="3">難関・記述多め</button></div><div class="title">出題分野（10問）</div><div class="modes"><button class="mode" data-topic="総合"><strong>朝の理科ランダム</strong><span>4分野・実験・計算をバランスよく。</span></button><button class="mode" data-topic="物理"><strong>物理</strong><span>力・電気・光・音・てこ・計算。</span></button><button class="mode" data-topic="化学"><strong>化学</strong><span>気体・水溶液・燃焼・状態変化。</span></button><button class="mode" data-topic="生物"><strong>生物</strong><span>植物・人体・動物・生態系。</span></button><button class="mode" data-topic="地学"><strong>地学</strong><span>天気・地層・地震・天体。</span></button><button class="mode" data-topic="実験"><strong>実験</strong><span>観察・実験器具・結果の考察。</span></button></div>`;$('home').classList.remove('hidden');$('quiz').classList.add('hidden');$('result').style.display='none';document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{level=+b.dataset.l;home()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.topic))}
function render(){let q=active[idx];$('counter').textContent=`第 ${idx+1} 問 / 10`;$('label').textContent=`${topic} · ${['基本','標準・受験','難関'][level-1]}`;$('bar').style.width=idx*10+'%';$('kind').textContent=`${q.area} · ${q.kind}`;$('question').textContent=q.text;$('diagram').innerHTML=q.input&&q.kind.includes('計算')?'<div class="diagram">単位を確かめてから、式を立てよう。</div>':'';$('feedback').className='feedback';$('next').className='next';$('answers').innerHTML='';if(q.type==='choice'){let b=document.createElement('div');b.className='choices';shuffle(q.options).forEach(x=>{let z=document.createElement('button');z.className='choice';z.textContent=x;z.onclick=()=>judge(x,z);b.append(z)});$('answers').append(b)}else{$('answers').innerHTML='<div class="answer"><input id="input" autocomplete="off" inputmode="decimal" placeholder="答えを入力"><button id="submit">答える</button></div>';$('submit').onclick=()=>judge($('input').value);setTimeout(()=>$('input').focus(),30)}}function judge(v,b){if($('next').classList.contains('show'))return;let q=active[idx],ok=answerMatches(v,q.answer);if(q.type==='choice'){document.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(clean(x.textContent)===clean(q.answer))x.classList.add('correct')});if(!ok)b.classList.add('wrong')}else{$('input').disabled=true;$('submit').disabled=true;$('input').style.borderColor=ok?'#18775c':'#b9464c'}if(ok)score++;else miss.push(q);$('feedback').innerHTML=ok?`<b>正解！</b>${q.explain}`:`<b>正解は「${q.answer}」</b>${q.explain}`;$('feedback').classList.add('show');$('next').textContent=idx===9?'結果を見る':'次へ';$('next').classList.add('show')}$('next').onclick=()=>{idx++;idx<10?render():result()};function result(){save();$('quiz').classList.add('hidden');$('result').style.display='block';$('score').textContent=`${score}/10`;$('message').textContent=score>=8?'朝から観察力が冴えています。明日も10問続けよう。':score>=5?'間違いの理由を一言で説明できれば十分。明日また挑戦しよう。':'実験の「なぜ」を解説で確認して、明日また挑戦しよう。';$('review').className=miss.length?'review':'';$('review').innerHTML=miss.length?`<h3>今日の復習（最大4問）</h3><ul>${miss.slice(0,4).map(q=>`<li><b>${q.answer}</b> — ${q.explain}</li>`).join('')}</ul>`:''}$('retry').onclick=()=>{active=make(topic);idx=0;score=0;miss=[];$('result').style.display='none';$('quiz').classList.remove('hidden');render()};$('back').onclick=home;home();
</script></body></html>
