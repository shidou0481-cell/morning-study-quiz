<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>算数・受験対策クイズ</title><style>
:root{--navy:#183a63;--gold:#cf8b25;--paper:#fffdf8;--ink:#1d2a44;--line:#e6dfd2;--ok:#247b61;--ng:#b9464c}*{box-sizing:border-box}body{margin:0;background:#f4f0e8;color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif}.wrap{width:min(860px,calc(100% - 28px));margin:auto}header{background:linear-gradient(120deg,#142e51,#24578a);color:#fff;padding:28px 0}h1{font-size:clamp(1.5rem,5vw,2.1rem);margin:5px 0}.eyebrow{font-size:.75rem;letter-spacing:.12em;font-weight:700;opacity:.82}.sub{margin:0;opacity:.9}main{padding:25px 0 45px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:24px;box-shadow:0 7px 22px #473c2a13}.intro{line-height:1.75;color:#526078}.daily{padding:13px 15px;border-radius:11px;background:#edf4fa;color:#294b70;display:flex;justify-content:space-between;gap:8px}.title{font-weight:800;margin:20px 0 9px}.levels,.modes,.actions{display:flex;flex-wrap:wrap;gap:9px}.level,.mode,.action{font:inherit;cursor:pointer;border:0;border-radius:10px}.level{padding:9px 13px;border:1px solid #cbd8e3;background:#fff;color:#315273}.level.selected{color:#fff;background:var(--navy)}.mode{flex:1;min-width:210px;text-align:left;padding:18px;border:2px solid var(--line);background:#fff;color:var(--ink)}.mode:hover{border-color:var(--gold)}.mode strong{display:block;font-size:1.04rem;margin-bottom:5px}.mode span{font-size:.87rem;color:#667085}.hidden{display:none}.top{display:flex;justify-content:space-between;gap:8px;color:#667085;font-weight:700;font-size:.9rem}.badge{background:#f9e7bd;color:#76520d;border-radius:99px;padding:4px 9px}.bar{height:7px;background:#e6e0d7;border-radius:20px;overflow:hidden;margin:15px 0 25px}.bar div{height:100%;background:var(--gold);transition:.25s}.kind{font-size:.78rem;color:#936719;font-weight:800}.q{font-size:clamp(1.15rem,3.5vw,1.45rem);font-weight:700;line-height:1.7;margin:8px 0 20px}.formula{background:#f3f6f8;border:1px solid #d9e2e8;border-radius:10px;padding:12px;line-height:1.65;margin-bottom:16px}.answer{display:flex;gap:8px}.answer input{min-width:0;flex:1;font:inherit;font-size:1.05rem;border:2px solid #cbd8e3;border-radius:10px;padding:12px}.answer button,.next{font:inherit;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.feedback{display:none;margin-top:17px;padding:14px;border-radius:10px;background:#f7f3eb;line-height:1.7}.feedback.show{display:block}.next{display:none;margin:17px 0 0 auto}.next.show{display:block}#result{text-align:center;display:none}.score{font-size:4rem;line-height:1;color:var(--gold);font-weight:800;margin:18px}.review{text-align:left;border-top:1px solid var(--line);margin-top:20px;padding-top:16px}.review li{line-height:1.65;margin:8px 0}.action{padding:11px 16px;background:var(--navy);color:#fff;font-weight:700}.action.sub{background:#e8edf2;color:var(--ink)}@media(max-width:530px){.card{padding:18px}.answer{flex-wrap:wrap}.answer button{width:100%}}
</style></head><body><header><div class="wrap"><div class="eyebrow">MORNING MATH · ENTRANCE EXAM</div><h1>算数・受験対策クイズ</h1><p class="sub">文章題・図形・計算を、朝の10問で。</p></div></header><main class="wrap"><section id="home" class="card"></section><section id="quiz" class="card hidden"><div class="top"><span id="counter"></span><span class="badge" id="label"></span></div><div class="bar"><div id="bar"></div></div><div class="kind" id="kind"></div><div class="q" id="question"></div><div id="extra"></div><div class="answer"><input id="input" inputmode="decimal" autocomplete="off" placeholder="答えを入力"><button id="submit">答える</button></div><div class="feedback" id="feedback"></div><button class="next" id="next">次へ</button></section><section id="result" class="card"><div class="eyebrow" style="color:#76520d">RESULT</div><h2>今日の算数、おつかれさま！</h2><div class="score" id="score"></div><p id="message"></p><div class="actions"><button class="action" id="retry">もう10問</button><button class="action sub" id="back">トップへ</button></div><div id="review"></div></section></main><script>
const $=x=>document.getElementById(x),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>[...a].sort(()=>Math.random()-.5),clean=x=>String(x||'').normalize('NFKC').replace(/[\s　,，]/g,'').replace('−','-'),day=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());let level=2,set=[],i=0,score=0,miss=[];
function gcd(a,b){while(b)[a,b]=[b,a%b];return a}function frac(n,d){let g=gcd(n,d),top=n/g,bottom=d/g;return bottom===1?String(top):`${top}/${bottom}`}function ratio(a,b){let g=gcd(a,b);return `${a/g}:${b/g}`}function q(kind,text,answer,explain,extra=''){return{kind,text,answer:String(answer),explain,extra}}function answerMatches(value,answer){let v=clean(value),a=clean(answer);if(!v)return false;if(/^[-+]?\d+(\.\d+)?$/.test(v)&&/^[-+]?\d+(\.\d+)?$/.test(a))return Math.abs(Number(v)-Number(a))<1e-9;return v===a}
function generators(l){let a=rnd(12,48),b=rnd(12,48),c=rnd(2,9),d=rnd(2,9),x=rnd(3,12),y=rnd(3,12);let g=[];
g.push(()=>q('計算',`${a} × ${b} を計算しなさい。`,a*b,`${a}×${b}=${a*b}。`));g.push(()=>q('計算',`${a*c} ÷ ${c} を計算しなさい。`,a,`${a*c}÷${c}=${a}。`));g.push(()=>{let den=rnd(5,12),u=rnd(1,den-2),v=rnd(1,den-u-1);return q('分数',`${u}/${den} + ${v}/${den} を約分して答えなさい。`,frac(u+v,den),`分母をそろえたまま分子を足し、${frac(u+v,den)}に約分します。`)});g.push(()=>{let den=rnd(5,12),top=rnd(1,den-1),factor=rnd(2,6);return q('分数',`${top}/${den} × ${factor}/${factor} を約分して答えなさい。`,frac(top,den),`分子どうし・分母どうしをかけ、${top*factor}/${den*factor}を約分します。`)});
g.push(()=>{let p=rnd(12,35),n=rnd(2,8);return q('割合',`${p}円の品物を ${n} 個買います。代金はいくらですか。`,p*n,`${p}×${n}=${p*n}円。`)});g.push(()=>{let total=rnd(12,40)*100,rate=[10,20,25,40,50][rnd(0,4)];return q('割合',`${total}円の ${rate}% は何円ですか。`,total*rate/100,`${total}×${rate}÷100=${total*rate/100}円。`)});
g.push(()=>{let speed=rnd(3,8)*10,time=rnd(2,9);return q('速さ',`分速 ${speed}m で ${time}分歩きます。進む道のりは何mですか。`,speed*time,'道のり＝速さ×時間です。')});g.push(()=>{let time=rnd(3,12),speed=rnd(4,30)*5,dist=time*speed;return q('速さ',`${dist}m を ${time}分で進みます。分速は何mですか。`,speed,'速さ＝道のり÷時間です。')});
g.push(()=>{let w=rnd(4,18),h=rnd(4,18);return q('平面図形',`たて ${h}cm、横 ${w}cm の長方形の面積は何cm²ですか。`,w*h,'長方形の面積＝たて×横です。')});g.push(()=>{let base=rnd(2,10)*2,h=rnd(3,15);return q('平面図形',`底辺 ${base}cm、高さ ${h}cm の三角形の面積は何cm²ですか。`,base*h/2,'三角形の面積＝底辺×高さ÷2です。')});g.push(()=>{let r=rnd(2,8);return q('円',`半径 ${r}cm の円の面積は何cm²ですか。円周率は3.14とします。`,(3.14*r*r).toFixed(2),'円の面積＝半径×半径×3.14です。')});g.push(()=>{let r=rnd(2,8);return q('円',`半径 ${r}cm の円周は何cmですか。円周率は3.14とします。`,(2*3.14*r).toFixed(2),'円周＝直径×3.14＝半径×2×3.14です。')});
g.push(()=>{let l=rnd(3,12),w=rnd(3,12),h=rnd(3,12);return q('立体図形',`たて ${l}cm、横 ${w}cm、高さ ${h}cm の直方体の体積は何cm³ですか。`,l*w*h,'直方体の体積＝たて×横×高さです。')});g.push(()=>{let n=rnd(3,6),sum=rnd(50,90)*n;return q('平均',`${n}人の点数の合計は${sum}点です。平均は何点ですか。`,sum/n,'平均＝合計÷人数です。')});
if(l>=2){g.push(()=>{let A=rnd(3,9),B=rnd(3,9),all=A+B;return q('比',`赤玉と白玉の個数の比は ${A}:${B} です。全部で ${all*5}個あるとき、赤玉は何個ですか。`,A*5,`比の合計は${all}。${all*5}÷${all}=${5}より、赤玉は${A}×5=${A*5}個。`)});g.push(()=>{let n=rnd(2,6),m=rnd(2,6),v=rnd(3,9);return q('文章題',`ある数を ${n} 倍して ${m} を足すと ${n*v+m} になります。ある数は何ですか。`,v,`（${n*v+m}−${m}）÷${n}=${v}。`)});g.push(()=>{let A=rnd(3,9),B=rnd(3,9);return q('比',`${A}:${B} を、いちばん簡単な整数の比にしなさい。`,ratio(A,B),`${A}:${B} は約分して ${ratio(A,B)} です。`)});}
if(l>=3){g.push(()=>{let p=rnd(12,30),q2=rnd(10,25),t=rnd(4,8);return q('旅人算',`Aさんは分速${p}m、Bさんは分速${q2}mで同じ場所から反対向きに歩きます。${t}分後の2人の間の距離は何mですか。`,(p+q2)*t,`反対向きなので、速さを足します。（${p}+${q2}）×${t}です。`)});g.push(()=>{let a=rnd(3,8),b=rnd(2,7);return q('規則性',`1辺が${a}cmの正方形を${b}個、横につなげます。周りの長さは何cmですか。`,2*a*(b+1),`長方形と考えると、たて${a}cm、横${a*b}cm。周りは2×(${a}+${a*b})です。`)});}
return g}
function make(){let gs=generators(level);return shuffle(gs).slice(0,10).map(f=>f())}function logs(){return JSON.parse(localStorage.getItem('morning-math-log')||'{}')}function save(){let a=logs(),d=day(),v=a[d]||{sets:0,correct:0,total:0};v.sets++;v.correct+=score;v.total+=10;a[d]=v;localStorage.setItem('morning-math-log',JSON.stringify(a))}
function home(){let l=logs()[day()];$('home').innerHTML=`<div class="daily"><span>📘 ${l?`今日は <b>${l.correct}/${l.total}</b> 問正解（${l.sets}セット）`:'今日の記録はまだありません'}</span><span>朝10問</span></div><p class="intro">計算だけで終わらせず、文章題・割合・速さ・図形を毎日少しずつ。答えは数値、分数は <b>3/4</b> の形で入力します。</p><div class="title">難易度</div><div class="levels"><button class="level ${level===1?'selected':''}" data-l="1">基本</button><button class="level ${level===2?'selected':''}" data-l="2">標準・受験</button><button class="level ${level===3?'selected':''}" data-l="3">難関</button></div><div class="modes" style="margin-top:22px"><button class="mode" id="start"><strong>朝の算数ランダム 10問</strong><span>計算・文章題・図形をバランスよく。</span></button></div>`;$('home').classList.remove('hidden');$('quiz').classList.add('hidden');$('result').style.display='none';document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{level=+b.dataset.l;home()});$('start').onclick=()=>{set=make();i=0;score=0;miss=[];$('home').classList.add('hidden');$('quiz').classList.remove('hidden');render()}}
function render(){let z=set[i];$('counter').textContent=`第 ${i+1} 問 / 10`;$('label').textContent=['基本','標準・受験','難関'][level-1];$('bar').style.width=i*10+'%';$('kind').textContent=z.kind;$('question').textContent=z.text;$('extra').innerHTML=z.extra;$('input').value='';$('input').disabled=false;$('submit').disabled=false;$('input').style.borderColor='';$('feedback').className='feedback';$('next').className='next';setTimeout(()=>$('input').focus(),30)}
function judge(){if($('next').classList.contains('show'))return;let z=set[i],ok=answerMatches($('input').value,z.answer);if(ok)score++;else miss.push(z);$('input').disabled=true;$('submit').disabled=true;$('input').style.borderColor=ok?'#247b61':'#b9464c';$('feedback').innerHTML=ok?`<b>正解！</b>${z.explain}`:`<b>正解は「${z.answer}」</b>${z.explain}`;$('feedback').classList.add('show');$('next').textContent=i===9?'結果を見る':'次へ';$('next').classList.add('show')}$('submit').onclick=judge;$('next').onclick=()=>{i++;i<10?render():result()};function result(){save();$('quiz').classList.add('hidden');$('result').style.display='block';$('score').textContent=`${score}/10`;$('message').textContent=score>=8?'朝から絶好調。明日も10問、積み上げよう。':score>=5?'間違いを2問だけ見直して、明日に回そう。':'型を知れば解ける問題ばかり。解説を味方にしよう。';$('review').className=miss.length?'review':'';$('review').innerHTML=miss.length?`<h3>今日の復習（最大4問）</h3><ul>${miss.slice(0,4).map(x=>`<li><b>${x.answer}</b> — ${x.explain}</li>`).join('')}</ul>`:''}$('retry').onclick=()=>{set=make();i=0;score=0;miss=[];$('result').style.display='none';$('quiz').classList.remove('hidden');render()};$('back').onclick=home;home();
</script></body></html>
